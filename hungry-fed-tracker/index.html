<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
    <title>Hungry/Fed Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Tracker</h1>
        </header>
        <main id="content">
            <div class="tracker-container">
                <div class="status-display" id="status">
                    <span id="statusText">HUNGRY</span>
                </div>
                <div class="button-group">
                    <button class="tracker-btn" id="hungryBtn">😋 Hungry</button>
                    <button class="tracker-btn" id="fedBtn">🥕 Fed</button>
                </div>
                <div class="timestamp" id="timestamp">Never fed</div>
            </div>
        </main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
