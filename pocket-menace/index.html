<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>pocket menace</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="main">
    <div id="topbar">
      <span id="petname">???</span>
      <span id="petstage"></span>
      <span id="dots"></span>
    </div>
    <div id="stage">
      <div id="speech"></div>
      <img id="pet" src="sprites/egg.png" alt="your menace">
      <div id="sulknote">...</div>
      <div id="poop">💩</div>
      <div id="zzz">z z z</div>
      <div id="mealchip"></div>
      <div id="fx"></div>
    </div>
    <div id="stats"></div>
    <div id="nav">
      <button id="btn-feed"><span class="ni">🍕</span>FEED</button>
      <button id="btn-play"><span class="ni">🎮</span>PLAY</button>
      <button id="btn-sleep"><span class="ni">💤</span>SLEEP</button>
      <button id="btn-clean"><span class="ni">🧼</span>CLEAN</button>
      <button id="btn-menu"><span class="ni">⚙️</span>MENU</button>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/hw.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
